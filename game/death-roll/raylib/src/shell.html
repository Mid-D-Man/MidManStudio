<!doctype html>
<!-- Emscripten shell for Death Roll. mray picks this up automatically (raylib/src/shell.html) and passes it as --shell-file.
     Full-viewport canvas with no scrolling, zooming or text selection, so a phone treats every touch as game input;
     a thin loading bar until the game's data has downloaded; the usual {{{ SCRIPT }}} placeholder where emscripten puts its loader. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#162232">
<title>Death Roll - MidManStudio</title>
<style>
  html, body { margin: 0; height: 100%; background: #162232; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas#canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          color: #9fb4c4; font: 600 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .14em; text-transform: uppercase;
          background: #162232; transition: opacity .35s; }
  #boot.done { opacity: 0; pointer-events: none; }
  #title { color: #60ff80; font-size: 20px; letter-spacing: .2em; }
  #bar { width: min(60vw, 280px); height: 4px; background: #24364a; border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #60ff80; transition: width .15s; }
  #msg { min-height: 1.3em; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="boot"><div id="title">Death Roll</div><div id="bar"><i id="fill"></i></div><div id="msg">Loading</div></div>
<script>
  (function () {
    var boot = document.getElementById("boot"), fill = document.getElementById("fill"), msg = document.getElementById("msg");
    var canvas = document.getElementById("canvas");

    // no context menu, no pinch zoom, no scrolling: every touch belongs to the game
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }); });
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    // inside an iframe the page must hold keyboard focus to receive keys
    window.addEventListener("pointerdown", function () { window.focus(); });

    canvas.addEventListener("webglcontextlost", function (e) {
      e.preventDefault();
      msg.textContent = "Graphics context lost - reload the page";
      boot.classList.remove("done");
    }, false);

    window.Module = {
      canvas: canvas,
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      setStatus: function (text) {
        if (!text) { boot.classList.add("done"); return; }                      // empty status: everything is ready
        var m = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text);
        if (m && +m[2] > 0) fill.style.width = Math.min(100, (+m[1] / +m[2]) * 100) + "%";
        msg.textContent = text.replace(/\(.*\)/, "").trim();
      },
      onAbort: function (what) { msg.textContent = "The game stopped: " + what; boot.classList.remove("done"); }
    };
    window.onerror = function (message) { msg.textContent = "Error: " + message; boot.classList.remove("done"); };
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
