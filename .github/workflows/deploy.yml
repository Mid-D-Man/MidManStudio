# FILE: .github/workflows/deploy.yml
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Removed cache: 'npm' to prevent the action from failing while looking for a lockfile

      - name: Install dependencies
        # Switched to 'npm install' to generate the lockfile and install dependencies on the fly
        run: npm install

      - name: Build
        run: npm run build

      - name: Ensure Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler@3 pages project list | grep -q -w "midmanstudio"; then
            echo "Project 'midmanstudio' not found. Creating..."
            npx wrangler@3 pages project create midmanstudio --production-branch main
          else
            echo "Project 'midmanstudio' already exists."
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=midmanstudio
